# Workflow 이름 (GitHub Actions 탭에 표시됩니다)
name: CI Pipeline

# 이 Workflow를 실행시키는 조건
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ── Job 1: 백엔드 빌드 & 테스트 ──
  backend-ci:
    runs-on: ubuntu-latest

    # [1] 테스트용 MariaDB를 옆에 같이 띄움 (yml의 local 프로필과 동일한 값)
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: "1234"
          MARIADB_DATABASE: user_db
        ports:
          - 3306:3306
        # DB가 완전히 켜질 때까지 기다렸다가 다음 단계 진행
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      # [2] 코드 가져오기
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # [3] Java 17 설치 (+ Maven 라이브러리 캐시로 속도 향상)
      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # [4] mvnw 실행 권한 부여
      - name: mvnw 실행 권한 부여
        run: chmod +x backend/mvnw

      # [5] 빌드 + 테스트 (이제 localhost:3306에 DB가 있음)
      - name: Maven 빌드 & 테스트
        working-directory: backend
        run: ./mvnw -B clean package

  # ── Job 2: 프론트엔드 빌드 ──
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      # [1] 코드 가져오기
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # [2] Node.js 설치 (+ npm 캐시)
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # [3] 라이브러리 설치 → 빌드
      - name: npm 설치 & 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build